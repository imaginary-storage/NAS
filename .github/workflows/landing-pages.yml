name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "install.sh"
      - ".github/workflows/landing-pages.yml"
  workflow_dispatch:

# One concurrent deploy at a time; cancel any in-flight run when a newer
# push arrives so old artifacts don't overwrite newer ones.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build (Vite, Tailwind v4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install
        working-directory: landing
        run: npm ci

      - name: Build
        working-directory: landing
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
